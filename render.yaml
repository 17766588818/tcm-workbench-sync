# Render Blueprint 部署配置（在 Render 控制台选择 "Blueprint" 并连此仓库即可一键部署）
# 部署后访问 https://<你的服务名>.onrender.com 即为工作台地址（若 public/ 已放入前端）。
services:
  - type: web
    name: tcm-workbench-sync
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: PORT
        value: 3000
      - key: ACCESS_KEY
        sync: false   # 在 Render 控制台手动设置，务必改成强密钥
      - key: DATA_FILE
        value: /app/data/db.json
    disk:
      name: tcm-data
      mountPath: /app/data
      sizeGB: 1

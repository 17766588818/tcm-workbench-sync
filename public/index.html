<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>快快的工作台 · 白芍</title>
<meta name="theme-color" content="#5C7A4D">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="快快的工作台">
<link rel="manifest" href="manifest.webmanifest">
<style>

:root{
  /* 暖调草本绿配色 */
  --bg:#F5F3EF; --side:#5C7A4D; --side2:#6B8E57; --brand:#5C7A4D; --brand2:#7CB342;
  --green:#5C7A4D; --green-d:#3D5A32; --green-l:#E8F5E9; --leaf:#7CB342;
  --ok:#66BB6A; --warn:#F0A030; --danger:#E53935; --line:#E0DED6; --txt:#2D2D2D; --mut:#888888;
  --card:#FFFFFF; --shadow:0 1px 3px rgba(92,122,77,.06),0 8px 24px rgba(92,122,77,.07);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;font-family:"Microsoft YaHei","PingFang SC",system-ui,-apple-system,sans-serif;color:var(--txt);background:var(--bg)}
.app{display:flex;height:100vh;overflow:hidden}
.side{width:250px;background:linear-gradient(180deg,#5C7A4D 0%,#4A6540 100%);color:#EDF2EB;display:flex;flex-direction:column;flex-shrink:0;box-shadow:2px 0 16px rgba(0,0,0,.12)}
.brand{padding:20px 18px 16px;display:flex;align-items:center;gap:11px;border-bottom:1px solid rgba(255,255,255,.08)}
.brand .logo{width:38px;height:38px;border-radius:11px;background:linear-gradient(135deg,#7CB342,#5C7A4D);display:flex;align-items:center;justify-content:center;box-shadow:0 4px 12px rgba(92,122,77,.35)}
.brand .logo svg{width:22px;height:22px;color:#fff}
.brand b{font-size:16px;font-weight:700;color:#fff;letter-spacing:.5px;display:block;line-height:1.2}
.nav{flex:1;overflow:auto;padding:14px 10px}
.nav .grp{padding:18px 14px 9px;margin:2px 10px 6px;font-size:14px;color:#F1F8EC;text-transform:none;letter-spacing:1px;font-weight:800;border-bottom:1px solid rgba(255,255,255,.16);text-shadow:0 1px 2px rgba(0,0,0,.22)}
.nav a{display:flex;align-items:center;gap:11px;padding:10px 12px;margin:2px 0;border-radius:10px;color:#D4E5CC;cursor:pointer;font-size:13.5px;transition:.15s}
.nav a:hover{background:rgba(255,255,255,.09);color:#fff}
.nav a.active{background:linear-gradient(90deg,rgba(124,179,66,.22),rgba(124,179,66,.06));color:#fff;box-shadow:inset 3px 0 0 var(--brand2)}
.nav a .ni{width:30px;height:30px;border-radius:9px;background:rgba(255,255,255,.09);display:flex;align-items:center;justify-content:center;color:#B8D4AA;flex-shrink:0}
.nav a.active .ni{background:linear-gradient(135deg,#7CB342,#5C7A4D);color:#fff}
.side .foot{padding:12px 18px;font-size:11px;color:#B8D4AA;border-top:1px solid rgba(255,255,255,.08)}
.main{flex:1;display:flex;flex-direction:column;overflow:hidden}
.topbar{padding:14px 24px;background:rgba(255,255,255,.85);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.topbar h1{font-size:17px;margin:0;font-weight:700;display:flex;align-items:center;gap:9px}
.topbar h1::before{content:"";width:9px;height:9px;border-radius:50%;background:var(--brand2);box-shadow:0 0 0 4px var(--green-l)}
.cmd{flex:1;min-width:300px;display:flex;gap:10px}
.cmd input{flex:1;padding:11px 16px;border:1px solid var(--line);border-radius:12px;font-size:13.5px;outline:none;background:#FAF9F6;transition:.15s}
.cmd input:focus{border-color:var(--brand2);box-shadow:0 0 0 4px var(--green-l);background:#fff}
.btn{border:none;background:linear-gradient(135deg,#7CB342,#5C7A4D);color:#fff;padding:11px 20px;border-radius:12px;cursor:pointer;font-size:13.5px;font-weight:600;box-shadow:0 4px 12px rgba(92,122,77,.26);transition:.15s}
.btn:hover{filter:brightness(1.06);transform:translateY(-1px)}
.btn.ghost{background:#E8F5E9;color:var(--green-d);box-shadow:none}
.btn.ghost:hover{background:#D4EDDA}
.btn.sm{padding:6px 13px;font-size:12px;border-radius:9px}
.btn.danger{background:#fdeaea;color:var(--danger);box-shadow:none}
.content{flex:1;overflow:auto;padding:24px}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:22px;margin-bottom:18px;box-shadow:var(--shadow)}
.card h2{margin:0 0 4px;font-size:18px}
.card .sub{color:var(--mut);font-size:12.5px;margin-bottom:16px}
.hero{background:linear-gradient(120deg,#5C7A4D 0%,#7CB342 100%);color:#fff;border:none;position:relative;overflow:hidden;display:flex;justify-content:space-between;align-items:center}
.hero::after{content:"";position:absolute;right:-40px;top:-40px;width:220px;height:220px;background:radial-gradient(circle,rgba(255,255,255,.14),transparent 70%);border-radius:50%}
.hero .h-txt{position:relative;z-index:1}
.hero h1{font-size:24px;margin:0 0 6px;display:flex;align-items:center;gap:10px;color:#fff}
.hero p{margin:0;opacity:.88;font-size:13px}
.hero .date{margin-top:12px;display:inline-block;background:rgba(255,255,255,.16);padding:5px 12px;border-radius:20px;font-size:12px}
.hero-art{position:relative;z-index:1;width:118px;height:118px;color:rgba(255,255,255,.92);flex-shrink:0}
.stats{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:14px}
.stat{background:linear-gradient(135deg,#FAFCF8,#F2F7EE);border:1px solid var(--line);border-radius:14px;padding:16px;display:flex;align-items:center;gap:14px}
.stat .ic{width:42px;height:42px;border-radius:12px;background:#fff;display:flex;align-items:center;justify-content:center;color:var(--brand);box-shadow:0 3px 8px rgba(92,122,77,.10);flex-shrink:0}
.stat .n{font-size:24px;font-weight:700;color:var(--green-d);line-height:1}
.stat .l{font-size:12px;color:var(--mut);margin-top:3px}
table{width:100%;border-collapse:separate;border-spacing:0;font-size:13px;overflow:hidden;border-radius:12px}
th,td{border-bottom:1px solid var(--line);padding:11px 12px;text-align:left;vertical-align:top}
th{background:#F2F4EF;font-weight:600;color:var(--green-d);white-space:nowrap;font-size:12.5px}
tbody tr:hover{background:#F8FAF6}
/* 销售记录行状态底色：已回款=绿，已开票=浅绿 */
tbody tr.row-paid{background:#E3F3DF}
tbody tr.row-paid:hover{background:#DAEFD4}
tbody tr.row-invoiced{background:#F1F8EC}
tbody tr.row-invoiced:hover{background:#EBF4E2}
td a.lk{color:var(--brand2);cursor:pointer;font-weight:500}
td a.lk:hover{text-decoration:underline}
.tag{display:inline-block;padding:2px 10px;border-radius:11px;font-size:11px;background:var(--green-l);color:var(--green-d);font-weight:500}
.tag.ok{background:#e3f7ea;color:var(--ok)}
.tag.warn{background:#fbf0d8;color:var(--warn)}
.tag.danger{background:#fdeaea;color:var(--danger)}
.empty{padding:36px;text-align:center;color:var(--mut)}
.row-actions{white-space:nowrap}
.chips{display:flex;flex-wrap:wrap;gap:9px;margin-top:8px}
.chip{background:var(--green-l);color:var(--green-d);border:none;padding:8px 14px;border-radius:18px;font-size:12.5px;cursor:pointer;font-weight:500;transition:.15s}
.chip:hover{background:var(--brand2);color:#fff}
.pill{font-size:11px;padding:3px 9px;border-radius:11px;background:var(--green-l);color:var(--green-d);font-weight:500}
.result{font-size:13.5px;line-height:1.7}
.result h3{margin:2px 0 10px;font-size:15px;color:var(--green-d)}
.result table{margin:10px 0}
.kv{display:grid;grid-template-columns:130px 1fr;gap:6px 14px;font-size:13px}
.kv b{color:var(--mut);font-weight:500}
.hint{background:#FFF9E6;border:1px solid #F0E6C8;color:#A08830;padding:11px 13px;border-radius:10px;font-size:12.5px;margin:8px 0}
.sec-title{font-size:13px;font-weight:700;color:var(--brand);margin:16px 0 7px;display:flex;align-items:center;gap:7px}
.sec-title::before{content:"";width:4px;height:14px;background:var(--brand2);border-radius:3px;display:inline-block}
pre{white-space:pre-wrap;font-family:inherit;margin:0}
.mono{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12.5px}
.cron-box{display:flex;gap:16px;align-items:flex-start;border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:12px;background:linear-gradient(135deg,#FCFDFB,#F4F8F0)}
.cron-box .cr{font-family:ui-monospace,monospace;background:#4A6540;color:#D4EDC8;padding:5px 12px;border-radius:8px;font-size:12px;white-space:nowrap}
.modal{position:fixed;inset:0;background:rgba(61,90,50,.50);display:none;align-items:flex-start;justify-content:center;overflow:auto;padding:48px 16px;z-index:50;backdrop-filter:blur(3px)}
.modal.show{display:flex}
.modal-box{background:#fff;border-radius:16px;width:min(640px,100%);padding:24px;box-shadow:0 20px 60px rgba(0,0,0,.25)}
.modal-box h3{margin:0 0 16px;font-size:17px;color:var(--green-d)}
.field{margin-bottom:13px}
.field label{display:block;font-size:12.5px;color:var(--mut);margin-bottom:5px}
.field input,.field select,.field textarea{width:100%;padding:9px 12px;border:1px solid var(--line);border-radius:9px;font-size:13.5px;font-family:inherit;background:#FAF9F6}
.field input:focus,.field select:focus,.field textarea:focus{outline:none;border-color:var(--brand2);box-shadow:0 0 0 3px var(--green-l)}
.field textarea{resize:vertical;min-height:64px}
.modal-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:10px}
.sync{display:flex;align-items:center;gap:7px;background:var(--green-l);border:1px solid var(--line);padding:7px 13px;border-radius:20px;cursor:pointer;font-size:12.5px;color:var(--green-d);font-weight:500;white-space:nowrap;transition:.15s;flex-shrink:0}
.sync:hover{background:#D4EDDA}
.sync .dot{width:9px;height:9px;border-radius:50%;background:#9CCC65;box-shadow:0 0 0 3px rgba(92,122,77,.10);transition:.2s}
.sync.err{background:#fdeaea;color:var(--danger);border-color:#f5c9c5}
.sync.err .dot{background:var(--danger)}
.sync.syncing{background:#fbf0d8;color:var(--warn);border-color:#f0e0b0}
.sync.syncing .dot{background:var(--warn)}
.field .sw{display:inline-flex;align-items:center;gap:8px;cursor:pointer;font-size:13px;color:var(--txt)}
/* ===== 文件上传 / 预览 ===== */
.file-wrap{margin-top:4px}
.file-list{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px}
.file-item{position:relative;display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px;border:1px solid var(--line);border-radius:10px;background:#FAF9F6;width:84px}
.file-item .thumb{width:70px;height:70px;object-fit:cover;border-radius:7px;cursor:pointer;background:#F2F4EF}
.file-item .ficon{width:70px;height:70px;display:flex;align-items:center;justify-content:center;font-size:30px;cursor:pointer;border-radius:7px;background:#F2F4EF;color:var(--brand)}
.file-item .fname{font-size:10.5px;color:var(--mut);max-width:74px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-align:center}
.file-item .fdel{position:absolute;top:-7px;right:-7px;width:20px;height:20px;border-radius:50%;background:var(--danger);color:#fff;border:none;cursor:pointer;font-size:12px;line-height:20px;text-align:center;padding:0;box-shadow:0 2px 4px rgba(0,0,0,.2)}
.file-add{display:inline-flex;align-items:center;gap:6px;margin-top:6px;padding:7px 13px;border:1px dashed var(--brand);border-radius:9px;color:var(--brand);background:#F4F8F0;cursor:pointer;font-size:12.5px;font-weight:500;transition:.15s}
.file-add:hover{background:var(--green-l)}
.file-add input[type=file]{display:none}
td .cell-files{display:flex;flex-wrap:wrap;gap:6px}
td .cell-thumb{width:40px;height:40px;object-fit:cover;border-radius:6px;cursor:pointer;border:1px solid var(--line)}
td .cell-file{display:inline-flex;align-items:center;gap:4px;padding:3px 9px;border:1px solid var(--line);border-radius:11px;background:var(--green-l);color:var(--green-d);font-size:11px;cursor:pointer;font-weight:500}
td .cell-file:hover{background:var(--brand2);color:#fff}
.file-modal{position:fixed;inset:0;background:rgba(45,65,35,.82);display:none;align-items:center;justify-content:center;z-index:80;padding:24px;backdrop-filter:blur(3px)}
.file-modal.show{display:flex}
.file-modal img{max-width:92vw;max-height:88vh;border-radius:10px;box-shadow:0 20px 60px rgba(0,0,0,.4)}
.file-modal .fm-bar{position:absolute;top:18px;right:22px;display:flex;gap:8px}
/* 登录门禁 */
.auth-gate{position:fixed;inset:0;z-index:200;display:none;align-items:center;justify-content:center;background:linear-gradient(135deg,#5C7A4D 0%,#3D5A32 100%);padding:20px}
.auth-card{background:#fff;border-radius:20px;width:min(380px,100%);padding:32px 28px;box-shadow:0 24px 70px rgba(0,0,0,.4);text-align:center}
.auth-logo{width:62px;height:62px;border-radius:17px;margin:0 auto 14px;background:linear-gradient(135deg,#7CB342,#5C7A4D);color:#fff;display:flex;align-items:center;justify-content:center;font-size:24px;font-weight:800;box-shadow:0 8px 20px rgba(92,122,77,.4)}
.auth-card h2{margin:0 0 6px;font-size:20px;color:var(--green-d)}
.auth-sub{color:var(--mut);font-size:13px;margin:0 0 20px}
.auth-card .field{text-align:left;margin-bottom:13px}
.auth-card .field label{display:block;font-size:12.5px;color:var(--mut);margin-bottom:5px}
.auth-card .field input{width:100%;padding:11px 14px;border:1px solid var(--line);border-radius:11px;font-size:14px;outline:none;box-sizing:border-box;background:#FAF9F6}
.auth-card .field input:focus{border-color:var(--brand2);box-shadow:0 0 0 4px var(--green-l);background:#fff}
.auth-err{color:var(--danger);font-size:12.5px;min-height:18px;margin:2px 0 12px;text-align:left}
.auth-link{display:inline-block;margin-top:12px;font-size:12.5px;color:var(--mut);cursor:pointer;text-decoration:underline}
.auth-link:hover{color:var(--green-d)}
.auth-remember{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--txt);margin:2px 0 2px;cursor:pointer;user-select:none}
.auth-remember input{width:16px;height:16px;accent-color:var(--green);cursor:pointer}
.usr{display:flex;align-items:center;gap:10px;margin-left:4px}
.ava{width:36px;height:36px;border-radius:50%;background:linear-gradient(135deg,#7CB342,#5C7A4D);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:15px;overflow:hidden;flex-shrink:0;border:2px solid #fff;box-shadow:0 2px 6px rgba(0,0,0,.15)}
.ava img{width:100%;height:100%;object-fit:cover}
.ico{width:36px;height:36px;border-radius:50%;border:1px solid var(--line);background:#fff;cursor:pointer;font-size:16px;display:flex;align-items:center;justify-content:center;color:var(--green-d);transition:.15s}
.ico:hover{background:var(--green-l)}

/* ===================== 计划管理：双面板布局 ===================== */
.plan-layout{display:flex;gap:18px;height:calc(100vh - 130px);min-height:480px}
.plan-left{flex:1;min-width:300px;overflow-y:auto}
.plan-right{flex:1.5;min-width:380px;overflow-y:auto}

/* 左侧：任务清单 */
.plan-list-card,.plan-cal-card{height:100%;display:flex;flex-direction:column}
.plan-header{display:flex;align-items:center;gap:10px;padding-bottom:14px;border-bottom:1px solid var(--line);margin-bottom:12px;flex-wrap:wrap}
.plan-month-label{font-size:13px;color:var(--mut);background:var(--green-l);padding:3px 10px;border-radius:11px;font-weight:600}
.plan-tasks{flex:1;overflow-y:auto}

/* 分组 */
.pt-group{margin-bottom:6px;border-bottom:1px dashed var(--line);padding-bottom:6px}
.pt-group-head{display:flex;align-items:center;gap:8px;padding:7px 4px;cursor:pointer;border-radius:8px;transition:.15s;-webkit-user-select:none;user-select:none}
.pt-group-head:hover{background:var(--green-l)}
.pt-group-arrow{font-size:10px;color:var(--mut);width:16px;text-align:center;transition:.2s}
.pt-group-name{font-weight:700;font-size:13.5px;color:var(--green-d);flex:1}
.pt-group-progress{font-size:11.5px;color:var(--mut);background:#fff;border:1px solid var(--line);padding:1px 8px;border-radius:10px}
.pt-group.collapsed .pt-items{display:none}
.pt-group.collapsed .pt-group-arrow{transform:rotate(0deg)}

/* 任务项 */
.pt-item{display:flex;align-items:center;gap:9px;padding:9px 8px;margin:2px 0;border-radius:10px;cursor:pointer;transition:.15s}
.pt-item:hover{background:var(--green-l)}
.pt-item.done{opacity:.55}
.pt-item.done .pt-title{text-decoration:line-through;color:var(--mut)}

/* 复选框 */
.pt-check{position:relative;display:flex;align-items:center;cursor:pointer;-webkit-user-select:none;user-select:none;flex-shrink:0}
.pt-check input{position:absolute;opacity:0;width:0;height:0}
.pt-check-box{width:20px;height:20px;border:2px solid var(--line);border-radius:6px;display:flex;align-items:center;justify-content:center;transition:.15s;background:#fff;flex-shrink:0}
.pt-check-box::after{content:'';width:10px;height:5.5px;border-left:2px solid #fff;border-bottom:2px solid #fff;transform:rotate(-45deg) scale(0);transition:.12s;margin-top:-2px}
.pt-check input:checked+.pt-check-box{background:var(--brand);border-color:var(--brand)}
.pt-check input:checked+.pt-check-box::after{transform:rotate(-45deg) scale(1)}
.pt-check:hover .pt-check-box{border-color:var(--brand2)}

/* 标题 */
.pt-title{flex:1;font-size:13.5px;color:var(--txt);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}

/* 标签 */
.pt-tag{font-size:10.5px;padding:2px 8px;border-radius:10px;font-weight:600;white-space:nowrap;flex-shrink:0}

/* 到期提示 */
.pt-due{font-size:11px;white-space:nowrap;flex-shrink:0;color:var(--mut)}
.pt-due.today{color:var(--ok);font-weight:700}
.pt-due.overdue{color:var(--danger);font-weight:700}
.pt-due.far{color:var(--mut)}

/* 右侧：日历 */
.cal-header{display:flex;align-items:center;gap:10px;padding-bottom:14px;border-bottom:1px solid var(--line);margin-bottom:12px;flex-wrap:wrap}
.cal-title{font-size:17px;font-weight:800;color:var(--green-d)}
.cal-nav{display:flex;gap:6px;margin-left:auto}
.cal-today-btn{font-weight:700}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;flex:1;align-content:start}
.cal-weekday{text-align:center;font-size:11.5px;color:var(--mut);font-weight:700;padding:8px 0 4px}
.cal-day{border:1px solid transparent;border-radius:10px;padding:4px 2px 2px;min-height:72px;cursor:pointer;transition:.15s;position:relative;background:#fafbfa}
.cal-day:hover{border-color:var(--brand2);background:#fff}
.cal-day.today{background:var(--green-l);border-color:var(--brand2);box-shadow:inset 0 0 0 1.5px var(--brand2)}
.cal-day.other-month{opacity:.35}
.cal-date-num{font-size:12.5px;font-weight:600;color:var(--txt);display:block;text-align:right;padding:1px 5px 2px}
.cal-date-num.today-num{color:var(--green-d);font-weight:800}
.cal-day-tasks{margin-top:2px;display:flex;flex-direction:column;gap:2px;max-height:90px;overflow:hidden}
.cal-task-pill{font-size:10px;padding:2px 6px;border-radius:8px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer;transition:.15s;display:block;line-height:1.4}
.cal-task-pill:hover{filter:brightness(.95);transform:scale(1.02)}
.cal-task-pill.done{opacity:.5;text-decoration:line-through}

@media(max-width:900px){
  .plan-layout{flex-direction:column;height:auto}
  .plan-left,.plan-right{min-width:unset}
}

/* ===================== 价格变动检测 ===================== */
.pw-head{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.pw-actions{display:flex;gap:8px;flex-wrap:wrap}
.pw-yao{background:linear-gradient(135deg,#F1F8EC,#E8F5E9);border-color:#cfe6c8}
.pw-yao-title{font-size:13.5px;font-weight:700;color:var(--green-d);margin-bottom:10px}
.pw-yao-links{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.pw-mini{font-size:11.5px;color:var(--mut);background:#fff;border:1px solid var(--line);padding:4px 10px;border-radius:9px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pw-last{margin-top:10px;font-size:12px;color:var(--mut)}
.pw-stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:14px 0}
.pw-stat{background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px;text-align:center;box-shadow:var(--shadow)}
.pw-stat-v{font-size:24px;font-weight:800;color:var(--txt)}
.pw-stat-l{font-size:12px;color:var(--mut);margin-top:3px}
.pw-stat.up .pw-stat-v{color:var(--danger)}
.pw-stat.down .pw-stat-v{color:var(--ok)}
.pw-stat.alert .pw-stat-v{color:var(--warn)}
.pw-list{display:flex;flex-direction:column;gap:8px}
.pw-row{display:grid;grid-template-columns:1.4fr 2fr 1fr 1fr auto;align-items:center;gap:10px;padding:11px 12px;border:1px solid var(--line);border-radius:12px;background:#fff;flex-wrap:wrap}
.pw-row.pw-alert{border-color:var(--warn);background:#fff8ec;box-shadow:0 0 0 2px rgba(240,160,48,.18)}
.pw-name{font-weight:700;font-size:14px;color:var(--green-d);display:flex;align-items:center;gap:7px}
.pw-badge{font-size:10px;font-weight:700;color:#fff;background:var(--warn);padding:1px 7px;border-radius:9px}
.pw-price{font-size:12.5px;color:var(--mut)}
.pw-price b{color:var(--txt);font-size:13.5px}
.pw-delta{font-size:13px;font-weight:700;text-align:center}
.pw-delta.up{color:var(--danger)}
.pw-delta.down{color:var(--ok)}
.pw-delta.flat{color:var(--mut)}
.pw-trend{font-size:12px;color:var(--mut);text-align:center}
.pw-ops{text-align:right}
.pw-toast{position:fixed;top:18px;left:50%;transform:translateX(-50%) translateY(-20px);background:linear-gradient(135deg,#3D5A32,#5C7A4D);color:#fff;padding:13px 22px;border-radius:12px;font-size:13.5px;font-weight:600;box-shadow:0 8px 28px rgba(61,90,50,.35);z-index:200;opacity:0;pointer-events:none;transition:.3s;max-width:90vw}
.pw-toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

@media(max-width:760px){
  .pw-stats{grid-template-columns:repeat(2,1fr)}
  .pw-row{grid-template-columns:1fr 1fr;font-size:12px}
  .pw-ops{grid-column:1/-1;text-align:left}
}

.yao-ref-title{font-size:13.5px;font-weight:700;color:#2b6cb0;margin-bottom:10px;display:flex;align-items:center;gap:6px}

/* ===================== 数据模型定义 ===================== */
const TODAY = new Date();
const num = v => { const n = parseFloat(String(v).replace(/,/g,'')); return isNaN(n)?0:n; };
const esc = s => (s==null?'':String(s)).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const ymd = d => d? new Date(d).toISOString().slice(0,10) : '';
function daysBetween(a,b){ if(!a||!b) return ''; const d=(new Date(b)-new Date(a))/86400000; return Math.max(0,Math.round(d)); }
function zhqiDays(s){ if(!s) return 0; const m=s.match(/(\d+)/); return m?+m[1]:0; }

/* ===================== 文件 / 图片 上传 ===================== */
const PF = {}; let PF_SEQ=0;          // 预览注册表：uid -> {name,type,data}
let modalFiles = {};                  // 当前弹窗内各文件字段数组 {key:[{name,type,data}]}
function readFileAsBase64(file){
  return new Promise((res,rej)=>{ const r=new FileReader(); r.onload=()=>res({name:file.name,type:file.type||'application/octet-stream',data:r.result}); r.onerror=rej; r.readAsDataURL(file); });
}
function isImageFile(f){ return f && f.type && String(f.type).indexOf('image/')===0; }
function fileCellHtml(v){
  if(!v||!v.length) return '—';
  let h='<div class="cell-files">';
  v.forEach(f=>{ const k='pf'+(++PF_SEQ); PF[k]=f;
    if(isImageFile(f)) h+=`<img class="cell-thumb" src="${f.data}" onclick="showFile('${k}')" title="${esc(f.name)}">`;
    else h+=`<span class="cell-file" onclick="showFile('${k}')">📎 ${esc(f.name)}</span>`; });
  return h+'</div>';
}
function fileEditHtml(key){
  let h=`<div class="file-list" id="filelist_${key}">`+fileListInner(key)+`</div>`;
  h+=`<label class="file-add">＋ 添加图片/文件<input type="file" multiple onchange="onFilePicked(event,'${key}')"></label>`;
  return h;
}
function fileListInner(key){
  const arr=modalFiles[key]||[]; let h='';
  arr.forEach((f,i)=>{ const ik='pf'+(++PF_SEQ); PF[ik]=f;
    if(isImageFile(f)) h+=`<div class="file-item"><img class="thumb" src="${f.data}" onclick="showFile('${ik}')"><span class="fname">${esc(f.name)}</span><button class="fdel" onclick="delFile('${key}',${i})">×</button></div>`;
    else h+=`<div class="file-item"><div class="ficon" onclick="showFile('${ik}')">📄</div><span class="fname">${esc(f.name)}</span><button class="fdel" onclick="delFile('${key}',${i})">×</button></div>`; });
  return h;
}
async function onFilePicked(e,key){
  const files=e.target.files; if(!files||!files.length) return;
  if(!modalFiles[key]) modalFiles[key]=[];
  for(const file of files){ try{ modalFiles[key].push(await readFileAsBase64(file)); }catch(err){} }
  const el=document.getElementById('filelist_'+key); if(el) el.outerHTML=`<div class="file-list" id="filelist_${key}">`+fileListInner(key)+`</div>`;
  e.target.value='';
}
function delFile(key,i){ if(modalFiles[key]) modalFiles[key].splice(i,1); const el=document.getElementById('filelist_'+key); if(el) el.outerHTML=`<div class="file-list" id="filelist_${key}">`+fileListInner(key)+`</div>`; }
function showFile(k){ const f=PF[k]; const box=document.getElementById('fileModal'); if(!box||!f) return;
  const body=box.querySelector('.fm-body');
  if(isImageFile(f)) body.innerHTML=`<img src="${f.data}">`;
  else body.innerHTML=`<div style="color:#fff;text-align:center"><p style="margin-bottom:16px">${esc(f.name)}</p><a class="btn" href="${f.data}" download="${esc(f.name)}">⬇ 下载文件</a></div>`;
  box.classList.add('show');
}
function closeFileModal(){ const box=document.getElementById('fileModal'); if(box) box.classList.remove('show'); }

/* ===================== 自动计算 ===================== */
function computeRow(id,row){
  row=Object.assign({},row);
  if(id==='jicai_purchase'||id==='normal_purchase'){
    const doneKey = ['采购量（kg）','采购量','已采购量'].find(k=>Object.prototype.hasOwnProperty.call(row,k));
    const done=num(doneKey?row[doneKey]:0);
    // 剩余采购量 / 采购进度：仅当该表定义了「剩余采购量」列时才计算（依赖年度计划采购量）
    if(TABLES[id].cols.some(c=>c.k==='剩余采购量')){
      const plan=num(row['年度计划采购量']);
      row['剩余采购量']=plan-done;
      row['采购进度']= plan>0? (Math.round(done/plan*100)+'% / '+(done>=plan?'已完成':(done>0?'执行中':'待启动'))) : (done>0?'执行中':'待启动');
    }
    // 集采中标价：按品种名称自动从「集采中标品种和价格」带出
    const vname=row['品种名称'];
    if(vname){ const wp=rows('win_price').find(r=>r['品种名称']===vname); if(wp && wp['中标价格']!==undefined && wp['中标价格']!=='') row['集采中标价']=num(wp['中标价格']); }
    // 采购总金额（元）= 采购价格 × 采购量
    if(TABLES[id].cols.some(c=>c.k==='采购总金额（元）')){
      const pk = Object.prototype.hasOwnProperty.call(row,'采购价格（元）')?'采购价格（元）':'采购价格';
      if(doneKey && row[pk]!==undefined) row['采购总金额（元）']=num(row[pk])*num(row[doneKey]);
    }
  }
  if(id==='sales'){
    const q=num(row['销售数量']), p=num(row['销售单价']), back=num(row['回款金额']);
    row['总金额']=q*p;
    row['应收款余额']=q*p-back;
    const ship=row['发货日期'];
    row['欠款天数']= daysBetween(ship,TODAY);
    const zd=zhqiDays(row['账期情况']);
    row['到期未回款金额']= (ship && zd && daysBetween(ship,TODAY)>zd && (q*p-back)>0)? (q*p-back):0;
  }
  if(id==='price'){
    const cur=num(row['当前市场价格']), prev=num(row['上次监测价格']);
    if(cur && prev){ row['变动幅度(元)']=+(cur-prev).toFixed(2); row['变动百分比']=+((cur-prev)/prev*100).toFixed(2); }
    else { row['变动幅度(元)']=0; row['变动百分比']=0; }
  }
  return row;
}

function renderTable(id){
  const t=TABLES[id]; const data=rows(id).map(r=>computeRow(id,r));
  let h=`<div class="card"><h2>${t.title}</h2><div class="sub">${t.sub} · 共 ${data.length} 条记录</div>`;
  h+=`<button class="btn sm" onclick="openAdd('${id}')">+ 添加行</button>`;
  if(data.length===0){ h+=`<div class="empty">暂无数据。点击「+ 添加行」开始录入，或使用顶部 Skill 指令查询。</div></div>`; document.getElementById('content').innerHTML=h; return; }
  h+='<table><thead><tr>';
  for(const c of t.cols) h+=`<th>${c.k}</th>`;
  h+='<th>操作</th></tr></thead><tbody>';
  data.forEach((r,idx)=>{
    let trc='';
    if(id==='sales'){
      if(r['回款情况']==='已回款') trc='row-paid';
      else if(r['发票情况']==='已开票') trc='row-invoiced';
    }
    h+='<tr'+(trc?' class="'+trc+'"':'')+'>';
    for(const c of t.cols){
      let v=r[c.k];
      if(c.t==='file'){ h+=`<td>${fileCellHtml(v)}</td>`; }
      else if(c.link){ h+=`<td><a class="lk" onclick="openLink('${c.link}','${esc(v)}')">${esc(v)||'—'}</a></td>`; }
      else if(c.t==='bool'){ h+=`<td>${v? '<span class="tag ok">是</span>':'<span class="tag">否</span>'}</td>`; }
      else h+=`<td>${esc(v)||''}</td>`;
    }
    h+=`<td class="row-actions"><button class="btn sm ghost" onclick="openEdit('${id}',${idx})">编辑</button><button class="btn sm danger" onclick="delRow('${id}',${idx})">删除</button></td></tr>`;
  });
  h+='</tbody></table></div>';
  document.getElementById('content').innerHTML=h;
}

const TAG_COLORS={一般:'var(--green-l)',重点:'#fbf0d8',紧急:'#fdeaea',下周:'#e8f0fd',本月:'#f3e8fd'};
const TAG_TEXT={一般:'var(--green-d)',重点:'var(--warn)',紧急:'var(--danger)',下周:'#1565c0',本月:'#7b1fa2'};

function ymStr(y,m){ return y+'年'+m+'月'; }

function migratePlanData(){
  let a=rows('plan'), changed=false;
  for(let i=0;i<a.length;i++){
    const r=a[i];
    if(r['内容']!==undefined && r['标题']===undefined){
      r['标题']=r['内容']; delete r['内容']; changed=true;
    }
    if(r['状态']==='已完成'){ r['完成']=true; delete r['状态']; changed=true; }
    else if(r['状态']!==undefined && r['完成']===undefined){ r['完成']=false; delete r['状态']; changed=true; }
    if(r['周期']!==undefined){ delete r['周期']; changed=true; }
  }
  if(changed) setRows('plan',a);
}

function migrateData(){
  let changed=false;
  // 常规品种采购：采购量→采购量（kg），采购价格→采购价格（元），去除不再使用的年度计划采购量
  let np=rows('normal_purchase');
  for(const r of np){
    if(r['采购量']!==undefined && r['采购量（kg）']===undefined){ r['采购量（kg）']=r['采购量']; delete r['采购量']; changed=true; }
    if(r['采购价格']!==undefined && r['采购价格（元）']===undefined){ r['采购价格（元）']=r['采购价格']; delete r['采购价格']; changed=true; }
    if(r['年度计划采购量']!==undefined){ delete r['年度计划采购量']; changed=true; }
  }
  if(changed) setRows('normal_purchase',np);
  // 集采品种采购：集采目录归属→集采批次；移除已废弃的年度计划采购量 / 剩余采购量 / 采购进度
  let jp=rows('jicai_purchase');
  for(const r of jp){
    if(r['集采目录归属']!==undefined && r['集采批次']===undefined){ r['集采批次']=r['集采目录归属']; delete r['集采目录归属']; changed=true; }
    for(const k of ['年度计划采购量','剩余采购量','采购进度']) if(r[k]!==undefined){ delete r[k]; changed=true; }
  }
  if(changed) setRows('jicai_purchase',jp);
  // 客户管理：联系方式→联系人1联系方式
  let cu=rows('customer');
  for(const r of cu){
    if(r['联系方式']!==undefined && r['联系人1联系方式']===undefined){ r['联系人1联系方式']=r['联系方式']; delete r['联系方式']; changed=true; }
  }
  if(changed) setRows('customer',cu);
  // 供应商库：企业类型→供应商类型（同值映射）；旧字段 基地类型(GAP/一般基地)→是否有GAP(bool)
  let sp=rows('supplier');
  for(const r of sp){
    if(r['基地类型']==='GAP') r['是否有GAP']=true;
    else if(r['基地类型']==='一般基地') r['是否有GAP']=false;
    if(r['基地类型']!==undefined) delete r['基地类型'];
    if(r['企业类型']!==undefined){ r['供应商类型']=r['企业类型']; delete r['企业类型']; }
    changed=true;
  }
  if(sp.length) setRows('supplier',sp);
}

function getPlanTasks(){
  migratePlanData();

function planCalMonth(offset){

}

function renderPlan(){
  const tasks=getPlanTasks();
  if(!_planYM){ const d=new Date(); _planYM={y:d.getFullYear(),m:d.getMonth()+1}; }
  const {_planYM:ym}= { _planYM }; // alias
  const y=ym.y, m=ym.m;

  // ---- 左侧：任务清单 ----
  let left='<div class="card plan-list-card">';
  left+='<div class="plan-header">';
  left+='<h2 style="margin:0;font-size:16px">'+icon('plan')+' 任务清单</h2>';
  left+='<span class="plan-month-label">'+ymStr(y,m)+'</span>';
  left+='<button class="btn sm" onclick="openAdd(\'plan\')">+ 添加任务</button>';
  left+='</div>';

  // 分组聚合
  const groups={};
  const ungrouped=[];
  for(const t of tasks){
    const g=(t['分组']||'').trim()||null;
    if(g){ if(!groups[g]) groups[g]=[]; groups[g].push(t); }
    else ungrouped.push(t);
  }

  left+='<div class="plan-tasks">';

  // 有分组的
  const gNames=Object.keys(groups).sort();
  if(gNames.length){
    for(const gn of gNames){
      const items=groups[gn];
      const doneCnt=items.filter(t=>t['完成']).length;
      const isCol=_planCollapsed[gn];
      left+='<div class="pt-group" id="pt_grp_'+escAttr(gn)+'"'+(isCol?' class="pt-group collapsed"':'')+'>';
      left+='<div class="pt-group-head" onclick="toggleGroup(\''+escAttr(gn)+'\')">';
      left+='<span class="pt-group-arrow">'+(isCol?'▶':'▼')+'</span>';
      left+='<span class="pt-group-name">'+esc(gn)+'</span>';
      left+='<span class="pt-group-progress">'+doneCnt+'/'+items.length+'</span>';
      left+='</div>';
      if(!isCol){
        left+='<div class="pt-items">';
        for(const t of items) left+=renderPTItem(t);
        left+='</div>';
      }
      left+='</div>';
    }
  }

  // 无分组任务
  for(const t of ungrouped) left+=renderPTItem(t);

  if(!tasks.length) left+='<div class="empty" style="padding:28px">暂无任务。点击「+ 添加任务」开始规划。</div>';
  left+='</div></div>'; // end plan-tasks, card

  // ---- 右侧：日历 ----
  const firstDay=new Date(y,m-1,1).getDay(); // 0=Sun
  const startWd=(firstDay===0)?7:firstDay; // 转为周一=1 ... 周日=7
  const daysInMonth=new Date(y,m,0).getDate();
  const today=new Date(), todayStr=ymd(today);

  let right='<div class="card plan-cal-card">';
  right+='<div class="cal-header">';
  right+='<button class="btn sm ghost" onclick="quickAddTask(\'\')" title="添加任务">+</button>';
  right+='<span class="cal-title">'+ymStr(y,m)+'</span>';
  right+='<div class="cal-nav">';
  right+='<button class="btn sm ghost" onclick="planCalMonth(-1)" title="上个月">&lt;</button>';
  right+='<button class="btn sm ghost cal-today-btn" onclick="planGoToday()">今天</button>';
  right+='<button class="btn sm ghost" onclick="planCalMonth(1)" title="下个月">&gt;</button>';
  right+='</div>';
  right+='</div>';

  // 星期头
  right+='<div class="cal-grid">';
  const wds=['一','二','三','四','五','六','日'];
  for(const wd of wds) right+='<div class="cal-weekday">'+wd+'</div>';

  // 上月补白
  const prevDays=new Date(y,m-1,0).getDate();
  for(let i=startWd-1;i>0;i--){
    right+='<div class="cal-day other-month"><span class="cal-date-num">'+(prevDays-i+1)+'</span></div>';
  }

  // 本月日期
  for(let d=1;d<=daysInMonth;d++){
    const ds=y+'-'+String(m).padStart(2,'0')+'-'+String(d).padStart(2,'0');
    const isToday=ds===todayStr;
    const dayTasks=tasks.filter(t=>t['日期']===ds);
    right+='<div class="cal-day'+(isToday?' today':'')+'" onclick="quickAddTask(\''+ds+'\')">';
    right+='<span class="cal-date-num'+(isToday?' today-num':'')+'">'+d+'</span>';
    if(dayTasks.length){
      right+='<div class="cal-day-tasks">';
      for(const dt of dayTasks){
        const tc=TAG_COLORS[dt['标签']]||TAG_COLORS['一般'];
        const tt=TAG_TEXT[dt['标签']]||TAG_TEXT['一般'];
        const doneCls=dt['完成']?' done':'';
        right+='<span class="cal-task-pill '+doneCls+'" style="background:'+tc+';color:'+tt+'" title="'+esc(dt['标题'])+(dt['完成']?' ✓':'')+'" onclick="event.stopPropagation();openEdit(\'plan\','+dt._idx+')">'+esc(dt['标题'])+'</span>';
      }
      right+='</div>';
    }
    right+='</div>';
  }

  // 下月补白
  const totalCells=startWd-1+daysInMonth;
  const remain=totalCells%7?(7-totalCells%7):0;

  const dateStr=t['日期'];
  let dueHtml='';
  if(dateStr){
    const today=new Date(), td=new Date(dateStr+'T00:00:00');
    const diff=Math.ceil((td-today)/86400000);
    if(diff<0) dueHtml='<span class="pt-due overdue">已过期'+Math.abs(diff)+'天</span>';
    else if(diff===0) dueHtml='<span class="pt-due today">今天</span>';
    else if(diff===1) dueHtml='<span class="pt-due">明天</span>';
    else if(diff<=7) dueHtml='<span class="pt-due">剩余'+diff+'天</span>';

    +'<label class="pt-check"><input type="checkbox"'+(done?' checked':'')+' onchange="togglePlanDone('+t._idx+')"><span class="pt-check-box"></span></label>'

}

function renderPriceWatch(){

      const pct=r['变动百分比']||0;
      const dir=pct>0?'up':(pct<0?'down':'flat');
      const hasPrev=(r['上次监测价格']!==undefined && r['上次监测价格']!=='');
      const alert=hasPrev && Math.abs(pct)>=PW_ALERT;
      let deltaTxt='持平';

      else if(!hasPrev) deltaTxt='未设基线';

      h+='</div>';
    });
    h+='</div></div>';
  }
  document.getElementById('content').innerHTML=h;
  updatePwFab();
}

function runPriceWatchCheck(showToast){
  const list=rows('price').map(r=>computeRow('price',r));
  const valid=list.filter(r=>r['当前市场价格']!==undefined && r['当前市场价格']!=='');
  const withPrev=valid.filter(r=>r['上次监测价格']!==undefined && r['上次监测价格']!=='');
  const up=withPrev.filter(r=>(r['变动百分比']||0)>0);
  const down=withPrev.filter(r=>(r['变动百分比']||0)<0);
  const alerts=withPrev.filter(r=>Math.abs(r['变动百分比']||0)>=PW_ALERT);
  const now=new Date();
  localStorage.setItem('tcm_pw_last', ymd(now)+' '+String(now.getHours()).padStart(2,'0')+':'+String(now.getMinutes()).padStart(2,'0'));
  if(showToast){
    if(!valid.length) toastPW('价格变动检测：尚未录入价格数据');
    else if(alerts.length) toastPW('⚠ 价格波动预警：'+alerts.length+' 个品种涨跌超 '+PW_ALERT+'%（'+up.length+' 涨 / '+down.length+' 跌）');
    else toastPW('📊 价格波动检测：'+up.length+' 涨 / '+down.length+' 跌，无超 '+PW_ALERT+'% 预警');
  }
  return {alerts,up,down,total:valid.length,withPrev:withPrev.length};
}

function updatePwFab(){
  try{
    const list=rows('price').map(r=>computeRow('price',r));
    const withPrev=list.filter(r=>r['当前市场价格']!==undefined && r['当前市场价格']!=='' && r['上次监测价格']!==undefined && r['上次监测价格']!=='');
    const alerts=withPrev.filter(r=>Math.abs(r['变动百分比']||0)>=PW_ALERT);
    const dot=document.getElementById('pwFabDot');
    if(!dot) return;
    if(alerts.length){ dot.style.display='inline-block'; dot.textContent=alerts.length>9?'9+':alerts.length; dot.title=alerts.length+' 个品种价格波动预警'; }
    else dot.style.display='none';
  }catch(e){}
}
function toastPW(msg){
  try{
    let t=document.getElementById('pwToast');
    if(!t){ t=document.createElement('div'); t.id='pwToast'; t.className='pw-toast'; (document.body||document.documentElement).appendChild(t); }
    t.textContent=msg; t.classList.add('show');
    clearTimeout(t._tm); t._tm=setTimeout(()=>t.classList.remove('show'),6000);
    if('Notification' in window && Notification.permission==='granted'){ try{ new Notification('快快的工作台 · 价格波动',{body:msg}); }catch(e){} }
  }catch(e){}
}

function forceClearSW(){

      navigator.serviceWorker.getRegistrations().then(function(regs){
        Promise.all(regs.map(function(r){return r.unregister();})).then(function(){
          if('caches' in window){ caches.keys().then(function(ks){ return Promise.all(ks.map(function(k){return caches.delete(k);})); }).then(function(){ location.reload(true); }); }
          else location.reload(true);
        }).catch(function(){ location.reload(true); });
      }).catch(function(){ location.reload(true); });
    } else { location.reload(true); }
  }catch(e){ location.reload ? location.reload(true) : window.location.reload(); }
}

/* ===================== 添加 / 编辑 行 模态框 ===================== */
function buildForm(id,row){
  const t=TABLES[id]; let body=`<h3>${row?'编辑 · '+t.title:'添加 · '+t.title}</h3>`;
  modalFiles={};
  const trigKeys=new Set(t.cols.filter(c=>c.showIf).map(c=>c.showIf.k));
  for(const c of t.cols){
    if(c.auto) continue;
    const val=row?row[c.k]:null;
    const sif=c.showIf?` data-cfield="${escAttr(c.k)}"`:'';
    body+=`<div class="field"${sif}><label>${c.k}${c.hint?' <span style="color:#9aa">('+c.hint+')</span>':''}</label>`;
    if(c.t==='file'){
      modalFiles[c.k]= (row && Array.isArray(val))? val.slice() : [];
      body+=`<div class="file-wrap" id="fw_${c.k}">${fileEditHtml(c.k)}</div>`;
    }
    else if(c.t==='enum'){ const cur=val||c.def||''; const trig=trigKeys.has(c.k)?` onchange="applyShowIf('${id}')"`:''; body+=`<select data-k="${c.k}"${trig}><option value="">—</option>`+c.opts.map(o=>`<option ${cur===o?'selected':''}>${o}</option>`).join('')+`</select>`; }
    else if(c.t==='bool'){ const cur=(val===true||val==='true')?'true':(val===false||val==='false')?'false':''; const trig=trigKeys.has(c.k)?` onchange="applyShowIf('${id}')"`:''; body+=`<select data-k="${c.k}"${trig}><option value="">—</option><option value="true" ${cur==='true'?'selected':''}>是</option><option value="false" ${cur==='false'?'selected':''}>否</option></select>`; }
    else if(c.t==='tags'){ body+=`<input data-k="${c.k}" value="${val?esc(String(val)):''}" placeholder="多个用逗号分隔" onchange="onFieldChange('${id}','${c.k}',this)">`; }
    else if(c.t==='textarea'){ body+=`<textarea data-k="${c.k}" placeholder="${c.hint||''}" onchange="onFieldChange('${id}','${c.k}',this)">${val!=null?esc(String(val)):''}</textarea>`; }
    else { const ro=c.readOnly?' disabled':''; body+=`<input data-k="${c.k}" type="${c.t==='number'?'number':(c.t==='date'?'date':'text')}" value="${val!=null?esc(String(val)):esc(c.def||'')}" placeholder="${c.hint||''}"${ro} onchange="onFieldChange('${id}','${c.k}',this)">`; }
    body+='</div>';
  }
  return body;
}
function openAdd(id){
  let extra='';
  if(id==='price') extra=yaoRefBar('');
  document.getElementById('modalBox').innerHTML=extra+buildForm(id,null)+`<div class="modal-actions"><button class="btn ghost" onclick="closeModal()">取消</button><button class="btn" onclick="saveAdd('${id}')">保存</button></div>`;
  applyShowIf(id); if(id==='jicai_purchase'||id==='normal_purchase') recomputePurchaseTotal(id); document.getElementById('modal').classList.add('show');
}
function openEdit(id,idx){
  let extra='';
  if(id==='price') extra=yaoRefBar(rows(id)[idx]['品种名称']||'');
  document.getElementById('modalBox').innerHTML=extra+buildForm(id,rows(id)[idx])+`<div class="modal-actions"><button class="btn ghost" onclick="closeModal()">取消</button><button class="btn" onclick="saveEdit('${id}',${idx})">保存</button></div>`;
  applyShowIf(id); if(id==='jicai_purchase'||id==='normal_purchase') recomputePurchaseTotal(id); document.getElementById('modal').classList.add('show');
}

/** 提示用户先填写品种名 */
function yaoPickVariety(){
  const box=document.getElementById('modalBox'); if(!box) return;
  const el=box.querySelector('[data-k="品种名称"]');
  if(el){ el.focus(); el.scrollIntoView({block:'center'}); }
}
function applyShowIf(id){
  const box=document.getElementById('modalBox'); if(!box) return;
  const t=TABLES[id]; if(!t) return;
  const vals={};
  t.cols.forEach(c=>{ const e=fieldEl(box,c.k); if(e) vals[c.k]=e.value; });
  t.cols.forEach(c=>{
    if(!c.showIf) return;
    const wrap=box.querySelector('[data-cfield="'+escAttr(c.k)+'"]');
    if(wrap) wrap.style.display=(String(vals[c.showIf.k])===String(c.showIf.eq))?'':'none';
  });
}
function collectRow(id){
  const box=document.getElementById('modalBox'); const row={};
  box.querySelectorAll('[data-k]').forEach(el=>{ const v=el.value; row[el.dataset.k]= (el.tagName==='SELECT'&&v==='true')?true:(el.tagName==='SELECT'&&v==='false')?false:v; });
  for(const c of TABLES[id].cols){ if(c.t==='file') row[c.k]= modalFiles[c.k]||[]; }
  return row;
}
function saveAdd(id){ const row=collectRow(id); const a=rows(id); a.push(computeRow(id,row)); setRows(id,a); closeModal(); renderTable(id); if(id==='customer') syncCustomerFromSales(); if(id==='price') updatePwFab(); }
function saveEdit(id,idx){ const row=collectRow(id); const a=rows(id); a[idx]=computeRow(id,row); setRows(id,a); closeModal(); renderTable(id); if(id==='customer') syncCustomerFromSales(); if(id==='price') updatePwFab(); }
function closeModal(){ document.getElementById('modal').classList.remove('show'); }

/* ===================== 表单字段联动 ===================== */
function fieldEl(box,k){ return Array.from(box.querySelectorAll('[data-k]')).find(e=>e.dataset.k===k); }
function valOf(box,k){ const e=fieldEl(box,k); return e?e.value.trim():''; }
function setVal(box,k,v){ const e=fieldEl(box,k); if(e && ((e.value===''||e.value==null) || e.tagName==='SELECT')) e.value=v; }
function onFieldChange(id,key,el){
  if(id==='price' && key==='品种名称') return refreshYaoRef(el.value);
  if((id==='jicai_purchase'||id==='normal_purchase') && (key==='采购价格'||key==='采购价格（元）'||key==='采购量'||key==='采购量（kg）')) return recomputePurchaseTotal(id);
  if(id==='contract' && (key==='销售合同订单号'||key==='客户名称')) return autoFillContract();
  if(id==='invoice' && (key==='发票号'||key==='客户名称')) return autoFillInvoice();
}
/** 采购表：实时重算 采购总金额（元）= 采购价格 × 采购量（自动定位各表字段名） */
function recomputePurchaseTotal(id){
  const box=document.getElementById('modalBox'); if(!box) return;
  const t=TABLES[id]; if(!t) return;
  const priceKey=t.cols.find(c=>c.t==='number'&&['采购价格（元）','采购价格'].includes(c.k));
  const qtyKey=t.cols.find(c=>c.t==='number'&&['采购量（kg）','采购量','已采购量'].includes(c.k));
  if(!priceKey||!qtyKey) return;
  const priceEl=box.querySelector('[data-k="'+escAttr(priceKey.k)+'"]');
  const qtyEl=box.querySelector('[data-k="'+escAttr(qtyKey.k)+'"]');
  const totalEl=box.querySelector('[data-k="采购总金额（元）"]');
  if(!totalEl || !priceEl || !qtyEl) return;
  const p=parseFloat(priceEl.value)||0, q=parseFloat(qtyEl.value)||0;
  totalEl.value = p*q;
}
/** 刷新药通网参考栏中的搜索按钮（品种名变化时） */
function refreshYaoRef(variety){
  const bar=document.querySelector('.yao-ref-bar'); if(!bar) return;
  const btns=bar.querySelector('.yao-ref-btns'); if(!btns) return;
  const q=encodeURIComponent(variety||'');
  const searchUrl=YAO_WEB+(variety?'/search.html?keyword='+q:'');
  // 替换第2个按钮（搜索/提示）
  const children=btns.children;
  if(children.length>=3){
    if(variety){
      children[1].outerHTML='<a class="btn sm" href="'+searchUrl+'" target="_blank" rel="noopener">🔍 搜索「'+esc(variety)+'」</a>';
    } else {
      children[1].outerHTML='<button class="btn sm ghost" onclick="yaoPickVariety()">📋 先填品种名再搜索</button>';
    }
  }
}
// 合同档案库：输入销售合同订单号 / 客户名称，自动从销售记录生成合同
function autoFillContract(){
  const box=document.getElementById('modalBox'); if(!box) return;
  const order=valOf(box,'销售合同订单号'), cust=valOf(box,'客户名称');
  let src=null;
  if(order) src=rows('sales').find(r=>r['销售合同订单号']===order);
  if(!src && cust) src=rows('sales').slice().reverse().find(r=>r['客户名称']===cust);
  if(!src) return;
  if(!valOf(box,'客户名称')) setVal(box,'客户名称',src['客户名称']||'');
  if(!valOf(box,'销售公司')) setVal(box,'销售公司',src['销售公司']||'');
  if(!valOf(box,'品种名称')) setVal(box,'品种名称',src['品种名称']||'');
  if(!valOf(box,'规格等级')) setVal(box,'规格等级',src['等级']||'');
  const amt=src['总金额']; if(amt!==undefined && amt!=='' && num(amt)>0 && !valOf(box,'合同金额')) setVal(box,'合同金额',amt);
}
// 发票档案库：输入发票号 / 客户名称，自动从销售记录生成发票
function autoFillInvoice(){
  const box=document.getElementById('modalBox'); if(!box) return;
  const no=valOf(box,'发票号'), cust=valOf(box,'客户名称');
  let src=null;
  if(no) src=rows('sales').find(r=>r['发票号']===no);
  if(!src && cust) src=rows('sales').slice().reverse().find(r=>r['客户名称']===cust);
  if(!src) return;
  if(!valOf(box,'客户名称')) setVal(box,'客户名称',src['客户名称']||'');
  if(!valOf(box,'销售公司')) setVal(box,'销售公司',src['销售公司']||'');
  const amt=src['总金额'];
  if(amt!==undefined && amt!=='' && num(amt)>0 && !valOf(box,'发票金额')) setVal(box,'发票金额',amt);
}

/* ===================== 关联跳转 ===================== */
function openLink(type,val){
  if(!val||val==='—'){ alert('该字段为空，无法跳转。'); return; }
  if(type==='logi'){ const url=LOGI_SITES[val]; if(url) window.open(url,'_blank'); else alert('未配置「'+val+'」的物流官网，请在 config/associations.sql 中补充映射。'); return; }
  if(type==='contract'){ const f=rows('contract').find(r=>r['合同编号']===val); if(f){ showCard('合同档案：'+val, kvHtml(f)); } else { showCard('合同调取',`<div class="hint">未找到合同编号「${esc(val)}」。请先在「合同档案库」录入。</div>`); } return; }
  if(type==='invoice'){ const f=rows('invoice').find(r=>r['发票号']===val); if(f){ showCard('发票档案：'+esc(val), kvHtml(f)); } else { showCard('发票调取',`<div class="hint">未找到发票号「${esc(val)}」。请先在「发票档案库」录入。</div>`); } return; }
  if(type==='customer'){ const f=rows('customer').find(r=>r['客户名称']===val); if(f){ showCard('客户详情：'+esc(val), kvHtml(f)); } else { showCard('客户详情',`<div class="hint">客户「${esc(val)}」尚未在客户管理中建档。可前往「客户管理」添加。</div>`); } return; }
}
function kvHtml(obj){ let h='<div class="kv">'; for(const k in obj){ const v=obj[k]; if(k===''||v===''||v==null) continue; if(Array.isArray(v)&&v.length){ h+=`<b>${esc(k)}</b><span>${fileCellHtml(v)}</span>`; } else { h+=`<b>${esc(k)}</b><span>${esc(v)}</span>`; } } return h+'</div>'; }
function showCard(title,body){ document.getElementById('content').innerHTML=`<div class="card"><h2>${title}</h2><div class="result">${body}</div><div style="margin-top:12px"><button class="btn ghost sm" onclick="go('dashboard')">返回总览</button></div></div>`; document.getElementById('pageTitle').textContent=title.replace(/[：:].*/,''); }

function fillCmd(q){ document.getElementById('cmdInput').value=q; document.getElementById('cmdInput').focus(); }
function runCmd(){ const v=document.getElementById('cmdInput').value.trim(); if(!v){alert('请输入指令');return;} const res=routeSkill(v); showResult(v,res); }
function showResult(cmd,html){ document.getElementById('content').innerHTML=`<div class="card"><h2>Skill 执行结果</h2><div class="sub">指令：${esc(cmd)}</div><div class="result">${html}</div><div style="margin-top:14px"><button class="btn ghost sm" onclick="go('dashboard')">返回总览</button></div></div>`; document.getElementById('pageTitle').textContent='Skill 结果'; }

function findCustomer(name){ if(!name) return null; return rows('customer').find(r=>r['客户名称']===name) || rows('customer').find(r=>r['客户名称'].includes(name)||name.includes(r['客户名称'])); }
function findInList(list,key,val){ if(!val) return null; return list.find(r=>(r[key]||'')===val) || list.find(r=>(r[key]||'').includes(val)||String(val).includes(r[key]||'')); }
function extract(input,re,fallback){ const m=input.match(re); if(m) return m[1]; if(fallback) return fallback; return ''; }

function routeSkill(input){
  const i=input;
  // 销售统计
  if(/总销量|总销售额|今年.*销量|今年.*销售额/.test(i)&&/白芍/.test(i)) return skSalesStat();
  if(/各客户.*采购总额排名|客户.*排名|采购总额排名/.test(i)) return skCustomerRank();
  if(/毛利/.test(i)) return skGrossMargin();
  if(/应收款/.test(i)) return skReceivable();
  if(/超期|逾期|超期未回款/.test(i)) return skOverdue();
  // 合同/发票调取
  let m=i.match(/合同[号]?([A-Za-z0-9\-]+)/); if(/查看合同|合同调取|调取.*合同/.test(i)&&m) return skGetContract(m[1]);
  m=i.match(/发票[号]?([A-Za-z0-9\-]+)/); if(/发票调取|调出.*发票|查看发票/.test(i)&&m) return skGetInvoice(m[1]);
  // 物流
  if(/货到哪|物流查询|物流/.test(i)){ const c=findNameIn(i,'customer'); return skLogistics(c); }
  // 对账单
  if(/对账单/.test(i)) return skStatement();
  // 合同/发票列表
  if(/新签合同|合同列表|列出.*合同/.test(i)) return skContractList();
  if(/已开票记录|发票列表|导出.*发票/.test(i)) return skInvoiceList();
  // 集采
  if(/中标价格|中标价/.test(i)){ const v=findVariety(i); return skWinPrice(v); }
  if(/供货价格|医院.*价格/.test(i)){ const v=findVariety(i),h=findNameIn(i,'customer'); return skHospitalPrice(v,h); }
  if(/采购进度/.test(i)){ const v=findVariety(i); return skPurchaseProgress(v); }
  if(/分配.*采购量|采购量分配/.test(i)){ const v=findVariety(i),p=i.match(/(\d+)\s*%/); return skAllocate(v,p?+p[1]:60); }
  // 供应商
  if(/资质.*审查|审查.*资质/.test(i)){ const s=findNameIn(i,'supplier'); return skReview(s); }
  if(/比选|GAP.*趁鲜|趁鲜.*供应商|供应商名单/.test(i)) return skCompare();
  if(/毒性.*校验|毒性.*资质/.test(i)) return skToxicCheck();
  if(/保护品种|国家保护/.test(i)) return skProtectCheck();
  // 客户
  if(/中标金额|联系人/.test(i)){ const c=findNameIn(i,'customer'); return skCustQuery(c); }
  if(/用货(统货|选货|精选)|(统货|选货|精选).*客户|筛选.*(统货|选货|精选)/.test(i)){ const m=i.match(/统货|选货|精选/); return skCustFilter(m?m[0]:'精选'); }
  if(/更新.*联系方式|联系方式.*更新/.test(i)){ const c=findNameIn(i,'customer'); const ph=i.match(/[0-9\-]{6,}/); return skCustUpdate(c,ph?ph[0]:''); }
  // 计划
  if(/今日待办|待办清单/.test(i)) return skToday();
  if(/周计划|投标工作清单/.test(i)) return skWeekPlan();
  // 价格监测
  if(/价格变动|价格波动|涨跌提醒|价格预警/.test(i)){ return skPriceWatch(); }
  if(/价格走势|趋势分析/.test(i)){ const v=findVariety(i); return skTrend(v); }
  if(/什么价格|现在什么价格|市场行情|行情/.test(i)){ const v=findVariety(i); return skMarket(v); }
  // 招标公告
  if(/招标公告|公告抓取/.test(i)) return skTender();
  return `<div class="hint">未匹配到已知 Skill。试试常用指令，或在「27 个 Skill 清单」页点击触发示例。例如：</div>
    <ul><li>查一下今年白芍的总销量和总销售额</li><li>哪些客户有超期未回款</li><li>查一下白芍的中标价格是多少</li><li>给我今天的待办清单</li></ul>`;
}

/* ===================== 云同步 ===================== */
const SYNC_KEY='tcm_sync_cfg';
let _syncing=false, _pushTimer=null, _currentView='dashboard';
let SYNC = loadSync();
function loadSync(){ try{ const s=JSON.parse(localStorage.getItem(SYNC_KEY)); if(s&&typeof s==='object') return Object.assign({enabled:false,url:'',key:'',mode:'auto',rev:0,status:'off',last:0,lastView:'dashboard'}, s); }catch(e){} return {enabled:false,url:'',key:'b2a2595d984bb6656f820fc2d0182e8a',mode:'auto',rev:0,status:'off',last:0,lastView:'dashboard'}; }
function saveSync(){ localStorage.setItem(SYNC_KEY, JSON.stringify(SYNC)); }
function apiUrl(p){ const b=(SYNC.url||'').trim().replace(/\/+$/,''); return (b||'')+'/api'+p; }
function timeAgo(t){ if(!t) return ''; const s=Math.floor((Date.now()-t)/1000); if(s<60) return '刚刚'; if(s<3600) return Math.floor(s/60)+' 分钟前'; if(s<86400) return Math.floor(s/3600)+' 小时前'; return Math.floor(s/86400)+' 天前'; }

async function cloudGet(){
  const r=await fetch(apiUrl('/db'),{headers:{'x-access-key':SYNC.key||''}});
  if(r.status===401) throw new Error('密钥不正确');
  if(!r.ok) throw new Error('拉取失败('+r.status+')');
  return await r.json();
}
async function cloudPut(data,baseRev){
  const r=await fetch(apiUrl('/db'),{method:'PUT',headers:{'x-access-key':SYNC.key||'','Content-Type':'application/json'},body:JSON.stringify({data,rev:baseRev})});
  if(r.status===401) throw new Error('密钥不正确');
  if(r.status===409){ const body=await r.json().catch(()=>({})); const e=new Error('conflict'); e.remote=body; throw e; }
  if(!r.ok) throw new Error('推送失败('+r.status+')');
  return await r.json();
}
function onLocalChange(){
  if(_syncing||!SYNC.enabled||SYNC.mode!=='auto') return;
  if(_pushTimer) clearTimeout(_pushTimer);
  _pushTimer=setTimeout(()=>{ cloudPush().catch(err=>setSyncStatus('error',err.message)); }, 800);
}
function rerenderCurrent(){
  const v=_currentView||'dashboard';
  if(v==='dashboard') renderDashboard();
  else if(TABLES[v]) renderTable(v);
  else renderSpecial(v);
}
async function cloudPull(){
  const j=await cloudGet();
  _syncing=true;
  try{
    if(j.rev>SYNC.rev){ DB=j.data; if(!DB||!DB.tables) DB={tables:{}}; SYNC.rev=j.rev; SYNC.last=Date.now(); saveSync(); save(); }
    else { SYNC.rev=j.rev; saveSync(); }
  } finally { _syncing=false; }
  rerenderCurrent(); setSyncStatus('ok'); return j;
}
async function cloudPush(){
  _syncing=true;
  try{ const res=await cloudPut(DB, SYNC.rev); SYNC.rev=res.rev; SYNC.last=Date.now(); SYNC.status='ok'; saveSync(); setSyncStatus('ok'); }
  finally { _syncing=false; }
}
async function syncNow(){
  setSyncStatus('syncing');
  try{ await cloudPull(); await cloudPush(); setSyncStatus('ok'); }
  catch(err){
    if(err.remote){
      _syncing=true;
      try{ DB=err.remote.data; if(!DB||!DB.tables) DB={tables:{}}; SYNC.rev=err.remote.rev; saveSync(); save(); rerenderCurrent(); }
      finally { _syncing=false; }
      try{ await cloudPush(); setSyncStatus('ok'); }
      catch(e2){ setSyncStatus('error', e2.message); }
    } else setSyncStatus('error', err.message);
  }
}
function setSyncStatus(st,msg){
  SYNC.status=st; if(st==='ok') SYNC.last=SYNC.last||Date.now(); saveSync();
  const box=document.getElementById('syncBox'), dot=document.getElementById('syncDot'), txt=document.getElementById('syncTxt');
  if(!box) return;
  const map={off:['#9bb1a3','未开启'],ok:['#1f9d57','已同步 · '+timeAgo(SYNC.last)],syncing:['#d99500','同步中…'],error:['#d8453b','同步异常']};
  const m=map[st]||map.off;
  box.classList.toggle('err', st==='error'); box.classList.toggle('syncing', st==='syncing');
  if(dot) dot.style.background=m[0];
  txt.textContent=msg||m[1];
}
function syncToggle(on){ SYNC.enabled=on; saveSync(); if(on){ syncSave(); syncNow(); } else setSyncStatus('off'); }
function syncSave(){
  SYNC.url=(document.getElementById('syncUrl').value||'').trim();
  SYNC.key=document.getElementById('syncKey').value||'';
  SYNC.mode=document.getElementById('syncMode').value;
  SYNC.enabled=document.getElementById('syncOn').checked;
  saveSync();
  const m=document.getElementById('syncTestMsg'); if(m){ m.textContent='已保存'; m.style.background='var(--green-l)'; }
  if(SYNC.enabled) syncNow();
}
async function syncTest(){
  const m=document.getElementById('syncTestMsg');
  const url=(document.getElementById('syncUrl').value||'').trim().replace(/\/+$/,'');
  const key=document.getElementById('syncKey').value||'';
  try{
    const r=await fetch((url||'')+'/api/health',{headers:{'x-access-key':key}});
    if(r.ok){ const j=await r.json(); if(m){ m.textContent='连接正常 · rev '+j.rev; m.style.background='var(--green-l)'; } }
    else if(r.status===401){ if(m){ m.textContent='可达，但密钥不正确'; m.style.background='#fbf0d8'; } }
    else if(m){ m.textContent='HTTP '+r.status; m.style.background='#fbf0d8'; }
  }catch(e){ if(m){ m.textContent='无法连接：'+e.message; m.style.background='#fdeaea'; } }
}

const AUTH_KEY='tcm_auth_v1';
let AUTH={account:'',passHash:'',avatar:'',remember:false};
let _loggedIn=false;
function loadAuth(){ try{ const a=JSON.parse(localStorage.getItem(AUTH_KEY)); if(a&&typeof a==='object'){ AUTH.account=a.account||''; AUTH.passHash=a.passHash||''; AUTH.avatar=a.avatar||''; AUTH.remember=!!a.remember; } }catch(e){} }
function saveAuth(){ localStorage.setItem(AUTH_KEY, JSON.stringify({account:AUTH.account,passHash:AUTH.passHash,avatar:AUTH.avatar,remember:AUTH.remember})); }
function hashPass(s){ let h=0; s=String(s||''); for(let i=0;i<s.length;i++){ h=(h*31+ s.charCodeAt(i))>>>0; } return 'k'+h.toString(16); }
function renderAvatar(){ const el=document.getElementById('hdrAva'); if(!el) return; if(AUTH.avatar){ el.innerHTML='<img src="'+AUTH.avatar+'" alt="头像">'; } else { el.textContent=(AUTH.account||'我').slice(0,1); } }
function authLoginHtml(){
  return '<div class="field"><label>账号</label><input id="lgAcc" value="'+esc(AUTH.account)+'" placeholder="请输入账号"></div>'
    +'<div class="field"><label>密码</label><input id="lgPwd" type="password" placeholder="请输入密码"></div>'
    +'<label class="auth-remember"><input type="checkbox" id="lgRem"'+(AUTH.remember?' checked':'')+'> 记住密码（下次自动进入）</label>'
    +'<div class="auth-err" id="authErr"></div>'
    +'<button class="btn" style="width:100%" onclick="doLogin()">进入工作台</button>'
    +'<span class="auth-link" onclick="resetAccount()">忘记密码？清除账户并重设</span>';
}
function authSetupHtml(){
  return '<div class="field"><label>设置账号</label><input id="stAcc" placeholder="设置登录账号"></div>'
    +'<div class="field"><label>设置密码</label><input id="stPwd" type="password" placeholder="至少 4 位"></div>'
    +'<div class="field"><label>确认密码</label><input id="stPwd2" type="password" placeholder="再次输入密码"></div>'
    +'<div class="field"><label>头像（可选）</label><input type="file" id="stAva" accept="image/*" onchange="previewAuthAvatar(this)"><div id="avaPrev"></div></div>'
    +'<div class="auth-err" id="authErr"></div>'
    +'<button class="btn" style="width:100%" onclick="doSetup()">创建并进入</button>';
}
function boot(){
  const gate=document.getElementById('authGate');
  const body=document.getElementById('authBody');
  if(AUTH.account){
    document.getElementById('authTitle').textContent='快快的工作台';
    // 勾选了“记住密码”则跳过输入，直接进入
    if(AUTH.remember){ enterApp(); return; }
    document.getElementById('authSub').textContent='请输入账号和密码进入';
    body.innerHTML=authLoginHtml();
  } else {
    document.getElementById('authTitle').textContent='欢迎使用 · 快快的工作台';
    document.getElementById('authSub').textContent='首次使用，请设置登录账号和密码';
    body.innerHTML=authSetupHtml();
  }
  gate.style.display='flex';
}
function enterApp(){
  _loggedIn=true;
  const gate=document.getElementById('authGate'); if(gate) gate.style.display='none';
  renderAvatar(); initApp();
}
function doLogin(){
  const acc=(document.getElementById('lgAcc').value||'').trim();
  const pwd=document.getElementById('lgPwd').value||'';
  const err=document.getElementById('authErr');
  if(acc!==AUTH.account || hashPass(pwd)!==AUTH.passHash){ err.textContent='账号或密码错误'; return; }
  err.textContent='';
  AUTH.remember=!!(document.getElementById('lgRem')&&document.getElementById('lgRem').checked);
  saveAuth();
  enterApp();
}
function doSetup(){
  const acc=(document.getElementById('stAcc').value||'').trim();
  const pwd=document.getElementById('stPwd').value||'';
  const pwd2=document.getElementById('stPwd2').value||'';
  const err=document.getElementById('authErr');
  if(!acc){ err.textContent='请设置账号'; return; }
  if(pwd.length<4){ err.textContent='密码至少 4 位'; return; }
  if(pwd!==pwd2){ err.textContent='两次输入的密码不一致'; return; }
  AUTH.account=acc; AUTH.passHash=hashPass(pwd); saveAuth();
  _loggedIn=true; err.textContent='';
  document.getElementById('authGate').style.display='none';
  renderAvatar(); initApp();
}
function previewAuthAvatar(input){
  const f=input.files&&input.files[0]; if(!f) return;
  const r=new FileReader();
  r.onload=()=>{ AUTH.avatar=r.result; const p=document.getElementById('avaPrev'); if(p) p.innerHTML='<img src="'+r.result+'" style="width:64px;height:64px;border-radius:50%;margin-top:8px">'; };
  r.readAsDataURL(f);
}
function resetAccount(){
  localStorage.removeItem(AUTH_KEY); AUTH={account:'',passHash:'',avatar:'',remember:false};
  document.getElementById('authTitle').textContent='欢迎使用 · 快快的工作台';
  document.getElementById('authSub').textContent='已清除，请重新设置登录账号和密码';
  document.getElementById('authBody').innerHTML=authSetupHtml();
}
function openSettings(){
  const box=document.getElementById('setBox');
  box.innerHTML='<h3>⚙ 账户设置</h3>'
    +'<div class="field"><label>账号</label><input id="setAcc" value="'+esc(AUTH.account)+'"></div>'
    +'<div class="field"><label>新密码（留空则不修改）</label><input id="setPwd" type="password" placeholder="不修改请留空"></div>'
    +'<div class="field"><label>确认新密码</label><input id="setPwd2" type="password" placeholder="再次输入新密码"></div>'
    +'<div class="field"><label>头像</label><input type="file" id="setAva" accept="image/*" onchange="previewSetAvatar(this)"><div id="setAvaPrev">'+(AUTH.avatar?'<img src="'+AUTH.avatar+'" style="width:64px;height:64px;border-radius:50%;margin-top:8px">':'')+'</div></div>'
    +'<div class="auth-err" id="setErr"></div>'
    +'<div style="display:flex;gap:10px;flex-wrap:wrap">'
    +'<button class="btn" onclick="saveSettings()">保存设置</button>'
    +'<button class="btn danger" onclick="logout()">退出登录</button>'
    +'<button class="btn ghost" onclick="closeSet()">取消</button></div>';
  document.getElementById('setModal').classList.add('show');
}
function previewSetAvatar(input){
  const f=input.files&&input.files[0]; if(!f) return;
  const r=new FileReader();
  r.onload=()=>{ AUTH.avatar=r.result; const p=document.getElementById('setAvaPrev'); if(p) p.innerHTML='<img src="'+r.result+'" style="width:64px;height:64px;border-radius:50%;margin-top:8px">'; };
  r.readAsDataURL(f);
}
function saveSettings(){
  const acc=(document.getElementById('setAcc').value||'').trim();
  const pwd=document.getElementById('setPwd').value||'';
  const pwd2=document.getElementById('setPwd2').value||'';
  const err=document.getElementById('setErr');
  if(!acc){ err.textContent='账号不能为空'; return; }
  if(pwd && pwd!==pwd2){ err.textContent='两次输入的密码不一致'; return; }
  AUTH.account=acc; if(pwd) AUTH.passHash=hashPass(pwd); saveAuth();
  renderAvatar(); closeSet();
}
function logout(){ _loggedIn=false; AUTH.remember=false; saveAuth(); closeSet(); boot(); }
function closeSet(){ document.getElementById('setModal').classList.remove('show'); }

/* ===================== 初始化 ===================== */
let _inited=false;
function initApp(){
  if(_inited) return; _inited=true;
  migrateData();
  // 每日价格变动自动检测（按日期门控：当天未检测则检测一次并推送横幅）
  try{
    const last=localStorage.getItem('tcm_pw_last')||'';
    if(last.indexOf(ymd(new Date()))<0){
      const res=runPriceWatchCheck(false);
      if(res.total) setTimeout(()=>{
        if(res.alerts.length) toastPW('⚠ 价格波动预警：'+res.alerts.length+' 个品种涨跌超 '+PW_ALERT+'%（'+res.up.length+' 涨 / '+res.down.length+' 跌）');
        else toastPW('📊 今日价格波动检测：'+res.up.length+' 涨 / '+res.down.length+' 跌，无超 '+PW_ALERT+'% 预警');
      },1200);
    }
  }catch(e){}
  renderNav();
  updatePwFab();
  if(SYNC.enabled){ cloudPull().catch(e=>{ console.warn('云端拉取失败：',e.message); setSyncStatus('error', e.message); }).finally(()=>go(SYNC.lastView||'dashboard')); }
  else { setSyncStatus('off'); go('dashboard'); }
  document.getElementById('cmdInput').addEventListener('keydown',e=>{ if(e.key==='Enter') runCmd(); });
}
loadAuth();
boot();
</script>

<script>
if('serviceWorker' in navigator){
  var _swr=false;
  function _swUp(){ navigator.serviceWorker.register('sw.js').then(function(reg){ if(reg&&reg.update){ reg.update(); } }).catch(function(){}); }
  window.addEventListener('load', _swUp);
  navigator.serviceWorker.addEventListener('controllerchange', function(){ if(!_swr){ _swr=true; location.reload(); } });
}
</script>
